<header class="app-header px-3 px-lg-4 pt-3 pb-2">
  <div class="container-fluid p-0">
    <div class="row align-items-center g-0">

      <!-- Left Column: Brand Logo -->
      <div class="col-auto">
        <div class="logo-circle">Pm.</div>
      </div>

      <!-- Center / Spacer Column -->
      <div class="col"></div>

      <!-- Right Column: User Info & Logout Button -->
      <div class="col-auto d-flex align-items-center gap-2 gap-md-3">

        <!-- User Info: User Name | Designation -->
        <div class="user-profile-badge d-flex align-items-center gap-2">
          <div class="user-avatar text-black-50">
            <i class="bi bi-person-fill"></i>
          </div>
          <div class="d-flex align-items-center gap-2 text-start">
            <span class="fw-semibold user-name text-dark">{{ userName }}</span>
            <span *ngIf="designation" class="text-secondary user-separator">|</span>
            <span *ngIf="designation" class="text-secondary user-designation">{{ designation }}</span>
          </div>
        </div>

        <!-- Shutdown / Logout Button with native Popper Tooltip -->
        <button
          #logoutBtn
          type="button"
          class="btn btn-sm btn-outline-danger d-inline-flex align-items-center justify-content-center shutdown-btn rounded-circle"
          (click)="onLogout()"
          data-bs-toggle="tooltip"
          data-bs-placement="bottom"
          title="Log out"
          aria-label="Log out">
          <i class="bi bi-power"></i>
        </button>

      </div>

    </div>
  </div>
</header>
