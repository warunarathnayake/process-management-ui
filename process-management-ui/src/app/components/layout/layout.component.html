<div class="app-shell d-flex flex-column min-vh-100">
  
  <!-- 1. Top: Full-Width Header -->
  <app-header (logout)="onLogout()"></app-header>

  <!-- 2. Middle Body: Sidebar on the Left + Dynamic Panel on the Right -->
  <div class="app-main-container d-flex flex-grow-1">
    
    <!-- Left Column: Sidebar (underneath the header) -->
    <aside class="sidebar-wrapper">
      <app-sidebar (menuSelect)="onMenuSelected($event)"></app-sidebar>
    </aside>

    <!-- Right Column: Relevant Panel (Rendered via Router Outlet) -->
    <main class="panel-wrapper flex-grow-1 px-3 px-lg-4 py-3">
      <router-outlet></router-outlet>
    </main>

  </div>

  <!-- 3. Bottom: System Footer -->
  <app-footer></app-footer>

</div>
