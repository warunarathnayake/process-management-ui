<aside class="app-sidebar d-flex flex-column h-100 py-3 px-2">
  <nav class="sidebar-nav flex-grow-1">
    
    <div *ngFor="let group of menuGroups; let first = first" class="menu-group" [class.mt-3]="!first">
      
      <!-- Group Title in Capital Letters -->
      <div *ngIf="group.title" class="menu-group-header px-2 py-1">
        <span class="group-title text-uppercase">{{ group.title }}</span>
      </div>

      <ul class="nav flex-column gap-1 list-unstyled m-0 p-0">
        
        <li *ngFor="let item of group.items" class="nav-item">
          
          <!-- CASE 1: Main Menu Item WITH Children (Expandable) -->
          <ng-container *ngIf="item.children && item.children.length > 0; else singleItemTpl">
            
            <button
              type="button"
              class="nav-link menu-item main-menu-item d-flex align-items-center justify-content-between w-100 border-0 bg-transparent text-start"
              [class.active]="selectedId === item.id"
              [class.is-expanded]="item.expanded"
              (click)="onSelectMain(item)"
              [attr.aria-expanded]="item.expanded">
              
              <!-- Left Side: Domain Icon + Main Menu Name -->
              <div class="d-flex align-items-center gap-2 menu-item-left">
                <span class="icon-slot">
                  <i class="bi menu-icon" [ngClass]="item.icon"></i>
                </span>
                <span class="menu-label">{{ item.label }}</span>
              </div>

              <!-- Optional Badge -->
              <span *ngIf="item.badge" class="badge rounded-pill ms-auto menu-badge">{{ item.badge }}</span>

            </button>

            <!-- Submenu Tree: Smooth Expand & Collapse Accordion -->
            <div class="submenu-tree-container" [class.is-expanded]="item.expanded">
              <div class="submenu-tree-inner">
                <ul class="submenu-tree list-unstyled m-0 p-0">
                  <li
                    *ngFor="let sub of item.children; let i = index"
                    class="submenu-item-wrap"
                    [style.--item-index]="i">
                    
                    <a
                      *ngIf="sub.route; else subButtonTpl"
                      [routerLink]="sub.route"
                      routerLinkActive="active"
                      [routerLinkActiveOptions]="{ exact: true }"
                      (click)="onSelectSub(item, sub, $event)"
                      class="submenu-link d-flex align-items-center gap-2 text-decoration-none"
                      [class.active]="selectedSubId === sub.id">
                      
                      <!-- Bullet Dot Slot (Exact same slot width and position as main menu icon) -->
                      <span class="icon-slot dot-slot">
                        <span class="tree-bullet-dot"></span>
                      </span>
                      <span class="submenu-label">{{ sub.label }}</span>
                      <span *ngIf="sub.badge" class="badge rounded-pill ms-auto submenu-badge">{{ sub.badge }}</span>
                    </a>

                    <ng-template #subButtonTpl>
                      <button
                        type="button"
                        class="submenu-link d-flex align-items-center gap-2 w-100 border-0 bg-transparent text-start"
                        [class.active]="selectedSubId === sub.id"
                        (click)="onSelectSub(item, sub, $event)">
                        <span class="icon-slot dot-slot">
                          <span class="tree-bullet-dot"></span>
                        </span>
                        <span class="submenu-label">{{ sub.label }}</span>
                        <span *ngIf="sub.badge" class="badge rounded-pill ms-auto submenu-badge">{{ sub.badge }}</span>
                      </button>
                    </ng-template>

                  </li>
                </ul>
              </div>
            </div>

          </ng-container>

          <!-- CASE 2: Single Main Menu Item WITHOUT Children (Direct Link) -->
          <ng-template #singleItemTpl>
            <a
              *ngIf="item.route; else directButtonTpl"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="onSelectMain(item)"
              class="nav-link menu-item main-menu-item d-flex align-items-center gap-2 w-100 border-0 bg-transparent text-start text-decoration-none"
              [class.active]="selectedId === item.id && !selectedSubId">
              <span class="icon-slot">
                <i class="bi menu-icon" [ngClass]="item.icon"></i>
              </span>
              <span class="menu-label">{{ item.label }}</span>
              <span *ngIf="item.badge" class="badge rounded-pill ms-auto menu-badge">{{ item.badge }}</span>
            </a>

            <ng-template #directButtonTpl>
              <button
                type="button"
                class="nav-link menu-item main-menu-item d-flex align-items-center gap-2 w-100 border-0 bg-transparent text-start"
                [class.active]="selectedId === item.id && !selectedSubId"
                (click)="onSelectMain(item)">
                <span class="icon-slot">
                  <i class="bi menu-icon" [ngClass]="item.icon"></i>
                </span>
                <span class="menu-label">{{ item.label }}</span>
                <span *ngIf="item.badge" class="badge rounded-pill ms-auto menu-badge">{{ item.badge }}</span>
              </button>
            </ng-template>
          </ng-template>

        </li>

      </ul>

    </div>

  </nav>
</aside>
